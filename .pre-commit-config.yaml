repos:
  # --- Ruff (Linter + Formatter) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^src/
      - id: ruff-format
        files: ^src/

  # --- Pylint ---
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.6
    hooks:
      - id: pylint
        args: ["--exit-zero"]
        files: ^src/
        additional_dependencies:
          - sqlalchemy
          - dependency-injector
          - fastapi
          - pydantic
          - requests
          - gitpython
        exclude: ^alembic/|src/app/presentation/frontend/

  # --- Mypy ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        files: ^src/
        additional_dependencies:
          - "pydantic>=2"
          - "pydantic[mypy]"
          - "fastapi>=0.110"
          - "starlette>=0.37"
          - "sqlalchemy>=2.0"
          - "alembic>=1.13"
          - "typing-extensions>=4.9"
          - types-passlib
          - types-PyJWT
          - python-dotenv
          - types-PyJWT
